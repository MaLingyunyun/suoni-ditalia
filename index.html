<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Italian phonics trainer: 12 cities, one group of sounds each, with a little winged companion.">
<title>Suoni d'Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500..700&family=Lexend:wght@300..700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: an Italian squared school notebook (quaderno a quadretti); one centered column; a winding road of passport stamps, one per city */
:root{
  --paper:#F5F8FC; --grid:#DEE6F1; --card:#FFFFFF; --ink:#15223D; --muted:#56637E; --line:#C8D3E3;
  --blue:#2140AE; --blue-soft:#E3E9FB; --vowel:#CF3A2A; --silent:#9AA4B9;
  --lemon:#F4C430; --lemon-soft:#FFF0BC; --lemon-ink:#352700; --lemon-deep:#BF9008;
  --good:#1D8350; --good-soft:#DCF2E5; --bad:#B4322A; --bad-soft:#FBE3E0;
  --sea-1:#D3E6FA; --sea-2:#A3C7EE; --bean-1:#E8C79B; --bean-2:#A8743F; --spark:#FFFFFF;
  --scrim:rgba(10,16,30,.45); --shadow:rgba(21,34,61,.10);
  --cushion:#E6DFF5; --cushion2:#F5F1FF; --nest-sun:#FFD166; --nest-floor:#EBD8C4; --nest-line:#C9A98A;
  --sky1-r1:#DDF0FF; --sky2-r1:#F6FBFF; --hills-r1:#A3C7EE; --sky1-r2:#FFE9C7; --sky2-r2:#FFF8EC; --hills-r2:#E0B080; --sky1-r3:#FFE1CF; --sky2-r3:#E5F5FF; --hills-r3:#7FC9F2;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Lexend","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1424; --grid:#17213A; --card:#141E34; --ink:#E7ECF6; --muted:#9CA8C1; --line:#2A3858;
    --blue:#93AAFF; --blue-soft:#1B2752; --vowel:#FF8272; --silent:#5F6B88;
    --lemon:#F4C430; --lemon-soft:#3A3011; --lemon-ink:#2A1F00; --lemon-deep:#E0B321;
    --good:#4FC58B; --good-soft:#0F2E20; --bad:#FF8273; --bad-soft:#3A1816;
    --sea-1:#12305A; --sea-2:#0A1C38; --bean-1:#D9B482; --bean-2:#8E5D2D; --spark:#FFFFFF;
    --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.35);
    --cushion:#3A3552; --cushion2:#4B456A; --nest-sun:#FFD166; --nest-floor:#3A2E26; --nest-line:#5A463A;
    --sky1-r1:#15305A; --sky2-r1:#0F1E3A; --hills-r1:#24406B; --sky1-r2:#4A2E1E; --sky2-r2:#2A1C14; --hills-r2:#6B4530; --sky1-r3:#3A2440; --sky2-r3:#102A44; --hills-r3:#1F4F6E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1424; --grid:#17213A; --card:#141E34; --ink:#E7ECF6; --muted:#9CA8C1; --line:#2A3858;
  --blue:#93AAFF; --blue-soft:#1B2752; --vowel:#FF8272; --silent:#5F6B88;
  --lemon:#F4C430; --lemon-soft:#3A3011; --lemon-ink:#2A1F00; --lemon-deep:#E0B321;
  --good:#4FC58B; --good-soft:#0F2E20; --bad:#FF8273; --bad-soft:#3A1816;
  --sea-1:#12305A; --sea-2:#0A1C38; --bean-1:#D9B482; --bean-2:#8E5D2D; --spark:#FFFFFF;
  --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.35);
  --cushion:#3A3552; --cushion2:#4B456A; --nest-sun:#FFD166; --nest-floor:#3A2E26; --nest-line:#5A463A;
  --sky1-r1:#15305A; --sky2-r1:#0F1E3A; --hills-r1:#24406B; --sky1-r2:#4A2E1E; --sky2-r2:#2A1C14; --hills-r2:#6B4530; --sky1-r3:#3A2440; --sky2-r3:#102A44; --hills-r3:#1F4F6E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; font:400 16px/1.55 var(--font-body); -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
a{color:var(--blue)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.center{text-align:center}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:8px 72px;outline:none}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--line)}
.topbar-in{max-width:660px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:2px;font:800 1.2rem/1 var(--font-display);letter-spacing:-.01em;color:var(--ink);min-width:0}
.brand .apos{color:var(--vowel)}
.chips{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 .8rem/1 var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;flex:none}
.iconbtn.armed{border-color:var(--bad);color:var(--bad)}
.ic{display:inline-grid;place-items:center;line-height:0}
.ic svg{width:1.15em;height:1.15em}

/* type */
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
.eyebrow{font:600 .72rem/1.2 var(--font-body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.section-title{font:800 1.35rem/1.1 var(--font-display);margin:28px 0 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.8rem 1.15rem;border-radius:13px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:600 1rem/1.1 var(--font-body);box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn-primary{background:var(--lemon);color:var(--lemon-ink);border-color:var(--lemon-deep);box-shadow:0 3px 0 var(--lemon-deep)}
.btn-primary:active:not(:disabled){box-shadow:0 1px 0 var(--lemon-deep)}
.btn-good{background:var(--good);color:var(--card);border-color:var(--good);box-shadow:0 3px 0 var(--ink)}
.btn-ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn-lg{padding:.9rem 1.3rem;font-size:1.05rem;text-align:left}
.btn .two{display:grid;gap:3px}
.btn .two small{font:500 .78rem/1.1 var(--font-body);opacity:.8}

.hero{margin-block:18px 4px}
.hero .it{font:700 2.1rem/1.05 var(--font-hand);color:var(--blue)}
.hero .en{color:var(--muted);margin-top:4px;max-width:56ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-block:14px 4px}

.banner{margin-top:14px;border:2px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:12px 14px;font-size:.92rem}
.banner b{display:block;margin-bottom:2px}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat .val{font:800 1.45rem/1.1 var(--font-display);font-variant-numeric:tabular-nums;margin-top:4px}
.stat .val small{font:500 .8rem var(--font-body);color:var(--muted)}
.meter{height:7px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--good);border-radius:99px}

/* five-step loop */
.loop{margin-top:22px}
.loop ol{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;counter-reset:s}
.loop li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px}
.loop li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font:800 .95rem/1 var(--font-display)}
.loop li b{font-family:var(--font-display);font-size:1.02rem}

/* road */
.road{position:relative;margin-top:8px}
.road svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.road .seg{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 10}
.road .seg.done{stroke:var(--blue);stroke-dasharray:none;stroke-width:3.5;opacity:.75}
.stop-row{position:relative;height:104px}
.stop{position:absolute;top:12px;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;border-radius:14px}
.stop.flip{flex-direction:row-reverse;text-align:right}
.stamp{position:relative;width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--blue);border:3px solid var(--blue);transform:rotate(var(--rot,-6deg));font:800 1.55rem/1 var(--font-display)}
.stamp::after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px dashed currentColor;opacity:.65}
.stamp .tiny{position:absolute;bottom:9px;line-height:0}
.stamp .tiny .ic svg{width:11px;height:11px}
.stop.is-done .stamp{background:var(--blue);color:var(--card)}
.stop.is-current .stamp{background:var(--lemon);color:var(--lemon-ink);border-color:var(--lemon-deep);animation:pulse 2.4s ease-in-out infinite}
.stop.is-locked .stamp{background:var(--paper);color:var(--silent);border-color:var(--silent);border-style:dashed}
.stop-label{min-width:0}
.stop-label b{display:block;font:800 1.08rem/1.1 var(--font-display)}
.stop-label small{display:block;color:var(--muted);font-size:.82rem;line-height:1.25}
.stop.is-locked .stop-label b{color:var(--muted)}
.stars{display:flex;gap:1px;margin-top:4px;color:var(--lemon-deep)}
.stop.flip .stars{justify-content:flex-end}
.stars .ic svg{width:14px;height:14px}
.stars .off{color:var(--line)}

.footer-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.sync{margin-top:12px;font-size:.8rem;color:var(--muted)}

/* diploma */
.diploma{margin-top:20px;background:var(--card);border:2px solid var(--blue);border-radius:16px;padding:16px;text-align:center;box-shadow:4px 4px 0 var(--blue)}
.diploma h2{font-size:1.5rem;color:var(--blue)}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;margin-block:12px 18px;position:relative}
.progress{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px}
.progress span{height:10px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.progress span.on{background:var(--good)}
.progress span.now::after{content:"";position:absolute;inset:0;width:var(--p,4%);background:var(--lemon-deep);border-radius:99px;transition:width .3s}
.leave-tip{position:absolute;left:46px;top:-2px;font-size:.78rem;color:var(--bad);background:var(--paper);padding:2px 6px;border-radius:6px}
.step-head{margin-bottom:10px}
.step-title{font:800 clamp(1.7rem,6.5vw,2.3rem)/1.02 var(--font-display);margin:.3rem 0 .25rem}
.step-sub{color:var(--muted);margin:0;max-width:56ch}

.player{display:flex;gap:12px;align-items:center;justify-content:center;margin-block:18px 20px}
.play{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:var(--lemon);color:var(--lemon-ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;flex:none}
.play .ic svg{width:38px;height:38px;margin-left:4px}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.play.playing{animation:ring 1s ease-out infinite}
.slow{display:inline-flex;align-items:center;gap:6px;padding:.5rem .8rem;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 .85rem/1 var(--font-body);color:var(--muted)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{position:relative;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px 10px 20px;font:500 clamp(1.45rem,6vw,1.95rem)/1.1 var(--font-body);box-shadow:0 3px 0 var(--line);overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--blue)}
.k{position:absolute;top:7px;left:9px;font:600 .68rem/1 var(--font-body);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.opt.good,.bucket.good,.sylbtn.good{border-color:var(--good);background:var(--good-soft);box-shadow:0 3px 0 var(--good)}
.opt.bad,.bucket.bad,.sylbtn.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
.opt.dim,.bucket.dim,.sylbtn.dim{opacity:.5}
.opt:disabled,.bucket:disabled,.sylbtn:disabled{cursor:default}

.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;border:2px solid;display:grid;gap:10px}
.feedback.good{background:var(--good-soft);border-color:var(--good)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.fb-head .ic{align-self:center}
.feedback.good .fb-head{color:var(--good)}
.feedback.bad .fb-head{color:var(--bad)}
.fb-head .it{font:700 1.8rem/1 var(--font-hand)}
.fb-head .en{font-size:.9rem;color:var(--muted)}
.fb-line{margin:0}
.fb-actions{display:flex;justify-content:flex-end}
.feedback.auto .btn{position:relative;overflow:hidden}
.feedback.auto .btn::after{content:"";position:absolute;left:0;bottom:0;height:3px;background:var(--card);opacity:.8;animation:drain var(--auto,1.6s) linear forwards}
.compare{display:flex;flex-wrap:wrap;gap:8px}
.cmp{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);text-align:left}
.cmp .w{font-size:1.25rem}
.cmp small{display:block;color:var(--muted);font-size:.78rem}
.cmp.target{border-color:var(--good)}

/* words */
.w{letter-spacing:.01em;white-space:nowrap}
.w .v{color:var(--vowel)}
.w .c{color:var(--blue)}
.w .s{color:var(--silent)}
.w .f{background:var(--lemon-soft);box-shadow:0 0 0 2px var(--lemon-soft);border-radius:3px}
.w .st{text-decoration:underline;text-decoration-thickness:.08em;text-underline-offset:.2em;text-decoration-color:var(--ink)}
.w .dot{color:var(--muted);opacity:.6;font-weight:300;margin-inline:.03em}
.w.plain .v,.w.plain .c,.w.plain .s{color:var(--ink)}
.gloss{color:var(--muted);font-size:.95rem}

/* learn */
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px 18px 16px;box-shadow:4px 4px 0 var(--ink)}
.card h3{font-size:1.45rem;line-height:1.15;margin:.35rem 0 .5rem}
.card p{margin:0 0 1rem;max-width:62ch}
.exs{display:flex;flex-wrap:wrap;gap:8px}
.ex{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px 12px 7px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);text-align:left;max-width:100%}
.ex .top{display:flex;align-items:center;gap:7px;font-size:1.3rem;font-weight:500}
.ex .top .ic{color:var(--muted);font-size:.85rem}
.ex small{color:var(--muted);font-size:.76rem}
.note{margin-top:14px;font:700 1.35rem/1.15 var(--font-hand);color:var(--blue)}
.dots{display:flex;gap:6px;justify-content:center;margin-block:16px 4px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--ink);width:22px;border-radius:99px}
.actionbar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--paper) 35%);margin-top:6px}
.actionrow{display:flex;justify-content:center;margin-top:18px}

/* read */
.readcard{margin:18px auto 6px;max-width:420px;text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:26px 14px 18px;box-shadow:4px 4px 0 var(--ink)}
.readcard .w{font-size:clamp(2.1rem,10vw,3rem);font-weight:500;white-space:normal;overflow-wrap:anywhere}
.readcard .gloss{margin-top:8px}
.read-actions{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.rate{margin-top:16px}
.rate p{margin:0 0 8px}
.rate-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* build */
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-block:4px 18px}
.slot{min-width:66px;height:60px;padding:0 10px;border-radius:12px;border:2px dashed var(--line);background:transparent;font:500 1.5rem/1 var(--font-body);display:grid;place-items:center}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--card)}
.slots.good .slot{border-color:var(--good);background:var(--good-soft)}
.slots.bad .slot{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-width:64px;height:56px;padding:0 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);font:500 1.45rem/1 var(--font-body)}
.tile.used{visibility:hidden}

/* tombola */
.caller{display:flex;align-items:center;justify-content:center;gap:12px;margin-block:14px 16px;flex-wrap:wrap}
.call-lbl{font:600 .85rem/1 var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.tcard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px;box-shadow:4px 4px 0 var(--ink);max-width:460px;margin:0 auto}
.cell{position:relative;aspect-ratio:1.3;min-width:0;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font:500 clamp(1rem,4.6vw,1.35rem)/1.1 var(--font-body);padding:4px;overflow:hidden}
.cell.marked .w{opacity:.55}
.cell.marked::after{content:"";position:absolute;width:24%;height:17%;right:7%;top:9%;border-radius:50%;background:radial-gradient(ellipse at 35% 35%,var(--bean-1),var(--bean-2));transform:rotate(-22deg);animation:drop .3s ease-out}
.cell.nope{animation:shake .35s;border-color:var(--bad)}
.cell.line{border-color:var(--lemon-deep);background:var(--lemon-soft)}
.tbanner{min-height:2.2em;margin-top:12px;text-align:center}
.tbanner .big{font:700 2.4rem/1 var(--font-hand);color:var(--blue)}

/* fish */
.sea{position:relative;height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--sea-1),var(--sea-2));border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.sea::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 20% 120%,transparent 0 18px,rgba(255,255,255,.05) 18px 20px);pointer-events:none}
.fish{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:10px 16px 10px 14px;border-radius:999px 70% 70% 999px;background:var(--card);border:2px solid var(--ink);font:500 1.2rem/1 var(--font-body);white-space:nowrap;will-change:transform}
.fish::after{content:"";position:absolute;right:-15px;top:50%;width:16px;height:22px;margin-top:-11px;background:var(--ink);clip-path:polygon(0 50%,100% 0,100% 100%)}
.fish.left{border-radius:70% 999px 999px 70%;padding:10px 14px 10px 16px}
.fish.left::after{right:auto;left:-15px;clip-path:polygon(100% 50%,0 0,0 100%)}
.fish .eye{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
.fish.caught{transition:transform .5s ease-in,opacity .5s;opacity:0}
.fish.nope{border-color:var(--bad);background:var(--bad-soft)}

/* sort */
.sortcard{margin:14px auto 18px;max-width:380px;min-height:130px;display:grid;place-items:center;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);font:500 clamp(2rem,9vw,2.6rem)/1 var(--font-body);padding:16px}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bucket{position:relative;padding:20px 10px 16px;border-radius:16px;border:2px solid var(--blue);background:var(--blue-soft);text-align:center;box-shadow:0 3px 0 var(--blue)}
.bucket b{display:block;font:800 1.5rem/1 var(--font-display);color:var(--blue)}
.bucket small{display:block;color:var(--muted);margin-top:4px;font-size:.82rem}

/* stress */
.sylrow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-block:4px 16px}
.sylbtn{position:relative;min-width:70px;height:70px;padding:0 14px;border-radius:14px;border:2px solid var(--ink);background:var(--card);box-shadow:0 3px 0 var(--ink);font:500 1.65rem/1 var(--font-body)}
.clap{display:block;text-align:center;font:700 1.3rem/1 var(--font-hand);color:var(--muted);margin-top:4px}

/* results */
.result{text-align:center;padding-top:8px}
.bigstamp{position:relative;width:176px;height:176px;margin:14px auto 8px;border-radius:50%;border:5px solid var(--blue);color:var(--blue);background:var(--card);display:grid;place-content:center;gap:6px;transform:rotate(-8deg);animation:press .65s cubic-bezier(.2,1.5,.45,1) both}
.bigstamp::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2px dashed currentColor;opacity:.7}
.bigstamp .n{font:600 .72rem/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase}
.bigstamp .city{font:800 1.3rem/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase;max-width:130px;overflow-wrap:anywhere}
.bigstamp.review{border-color:var(--good);color:var(--good)}
.stars-big{display:flex;justify-content:center;gap:6px;color:var(--lemon-deep);margin-block:6px}
.stars-big .ic svg{width:40px;height:40px}
.stars-big .off{color:var(--line)}
.stars-big .ic{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.result h1{font-size:clamp(2rem,8vw,2.6rem);margin-top:6px;font-family:var(--font-hand);font-weight:700;color:var(--blue)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:18px}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--card);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
.sheet h2{font-size:1.6rem;margin:4px 0 2px}
.sheet .exs{margin-block:12px}
.sheet-actions{display:grid;gap:10px;margin-top:14px}

/* settings & method */
.page-title{font:800 clamp(1.8rem,7vw,2.4rem)/1.05 var(--font-display);margin:16px 0 4px}
.list{display:grid;gap:8px;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);min-width:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow-wrap:anywhere}
.row .grow small{color:var(--muted)}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.switch:checked{background:var(--good)}
.switch:checked::after{left:21px}
input[type=range]{width:100%;accent-color:var(--blue)}
select{font:inherit;padding:.45rem .6rem;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.prose{max-width:62ch}
.prose h2{font-size:1.3rem;margin:26px 0 6px}
.prose p,.prose li{margin:0 0 .7rem}
.prose ol{padding-left:1.2rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0 10px;font-size:1.3rem}
.sources li{font-size:.9rem}

/* confetti */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100;display:none}

/* companions: nest, shop, quests, album, hatching */
.chip.coins{cursor:pointer;background:var(--lemon-soft);border-color:var(--lemon-deep);color:var(--ink)}
.chip .mini{display:inline-flex;align-items:center;gap:2px;margin-left:2px;padding-left:5px;border-left:1px solid var(--line);color:var(--blue)}
.chip .ic svg{width:15px;height:15px}
.nest{position:relative;margin-top:14px;border:2px solid var(--ink);border-radius:20px;overflow:hidden;background:var(--card);box-shadow:4px 4px 0 var(--ink)}
.nest.r1{--sky1:var(--sky1-r1);--sky2:var(--sky2-r1);--hills:var(--hills-r1)}
.nest.r2{--sky1:var(--sky1-r2);--sky2:var(--sky2-r2);--hills:var(--hills-r2)}
.nest.r3{--sky1:var(--sky1-r3);--sky2:var(--sky2-r3);--hills:var(--hills-r3)}
.nest{--sun:var(--nest-sun);--floor:var(--nest-floor);--floor-line:var(--nest-line)}
.nest svg.scene{display:block;width:100%;height:auto}
.nest .petwrap{cursor:pointer}
.bubble{position:relative;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:.95rem;box-shadow:3px 3px 0 var(--ink);min-width:0}
.bubble .it{font:700 1.3rem/1.1 var(--font-hand);color:var(--blue)}
.bubble .en{color:var(--muted);font-size:.8rem;margin-top:2px;line-height:1.3}
.nest .bubble{position:absolute;left:10px;top:10px;max-width:min(56%,300px);pointer-events:none}
.nest .bubble::after{content:"";position:absolute;left:28px;bottom:-9px;width:14px;height:14px;background:var(--card);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.nest-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-top:2px solid var(--ink);background:var(--card)}
.nest-bar .who{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.nest-bar .who b{font:800 1.1rem/1.1 var(--font-display)}
.nest-bar .who small{color:var(--muted);font-size:.8rem}
.nest-bar .who .meter{margin-top:6px;max-width:220px}
.nest-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn-sm{padding:.5rem .8rem;font-size:.88rem;border-radius:11px;box-shadow:0 2px 0 var(--ink)}
.btn-sm.btn-primary{box-shadow:0 2px 0 var(--lemon-deep)}
.luce{display:inline-flex;gap:4px;align-items:center}
.luce i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.luce i.on{background:var(--lemon);box-shadow:0 0 6px var(--lemon)}
.luce small{font-size:.75rem}
.homecards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.homecard{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);text-align:left;min-width:0}
.homecard>.ic svg{width:28px;height:28px}
.homecard b{display:block;font:800 1rem/1.1 var(--font-display)}
.homecard small{color:var(--muted);font-size:.8rem;display:block;overflow-wrap:anywhere}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:12px;scrollbar-width:none}
.tab{flex:none;padding:.5rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font:600 .9rem/1 var(--font-body)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.item{display:flex;flex-direction:column;gap:6px;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);min-width:0}
.item .pic{height:70px;display:grid;place-items:center}
.item .pic>.ic svg,.item .pic>svg{width:56px;height:56px}
.item .pic.egg svg{width:64px;height:72px}
.item b{font:800 1rem/1.15 var(--font-display)}
.item small{color:var(--muted);font-size:.78rem;line-height:1.3}
.price{display:inline-flex;align-items:center;gap:4px;font:700 .9rem var(--font-body);font-variant-numeric:tabular-nums}
.price .ic svg{width:16px;height:16px}
.price.off s{color:var(--muted);font-weight:500}
.item .btn{margin-top:auto;align-self:flex-start}
.quest{display:grid;gap:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.quest.done{border-color:var(--good);background:var(--good-soft)}
.quest .qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.quest .qh b{font:600 .95rem var(--font-body)}
.quest .qh>small{white-space:nowrap}
.quest .qh .it{font:700 1.2rem var(--font-hand);color:var(--blue)}
.quest .qh .ic{color:var(--good)}
.quest .meter{margin-top:0}
.quest .meter span{background:var(--blue)}
.quest.done .meter span{background:var(--good)}
.reward{display:flex;gap:10px;font-size:.8rem;color:var(--muted)}
.toasts{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;pointer-events:none;width:min(92vw,440px);align-items:center}
.toast{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--paper);font:600 .88rem/1.2 var(--font-body);box-shadow:0 6px 20px var(--shadow);animation:up .25s ease-out;max-width:100%}
.toast .ic svg{width:18px;height:18px;flex:none}
.hatchwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:12px;text-align:center}
.hatchwrap .stage{width:min(100%,420px);height:auto;display:block}
.born{font:800 1.6rem/1.2 var(--font-display);margin:0;min-height:1.3em;max-width:46ch}
.born small{display:block;font:400 .95rem/1.4 var(--font-body);color:var(--muted);margin-top:4px}
.nameform{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.nameform input{font:600 1.1rem var(--font-body);padding:.6rem .8rem;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);width:190px}
.album{display:grid;gap:10px;margin-top:12px}
.pet-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:16px;background:var(--card)}
.pet-row>svg{width:92px;height:92px}
.pet-row.locked{opacity:.8}
.resultpet{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;text-align:left}
.resultpet>svg{width:84px;height:84px;flex:none}
.resultpet .bubble{max-width:300px}
/* folletto animation */
.fe-root{animation:fe-bob 3.6s ease-in-out infinite}
.fe-wing{transform-box:fill-box;transform-origin:100% 55%;animation:fe-flut 1.7s ease-in-out infinite}
.fe-wings{transform-box:fill-box;transform-origin:50% 50%}
.fe-eye{transform-box:fill-box;transform-origin:50% 50%;animation:fe-blink 4.6s infinite}
.fe-closed,.fe-happy{display:none}
.fe.sleep .fe-open,.fe.sleep .fe-happy{display:none}
.fe.sleep .fe-closed{display:block}
.fe.sleep .fe-wing{animation-duration:4s}
.fe.cheer .fe-open,.fe.cheer .fe-closed{display:none}
.fe.cheer .fe-happy{display:block}
.fe.cheer .fe-root{animation:fe-hop .9s ease-out}
.fe-spark{transform-box:fill-box;transform-origin:50% 50%;animation:fe-twinkle 2.8s ease-in-out infinite}
.fe-zz{animation:fe-zz 2.4s ease-in-out infinite}
.eggwrap.wob{transform-box:fill-box;transform-origin:50% 100%;animation:egg-wob 5s ease-in-out infinite}
.egg{transform-box:fill-box;transform-origin:50% 100%}
.shell-top{transform-box:fill-box;transform-origin:50% 100%}
.h-shard{transform-box:fill-box;transform-origin:50% 50%}
.elfwrap{transform-origin:0 0}
.h-ring,.h-flash{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.h-mote{animation:h-mote 7s linear infinite;opacity:0}
@keyframes fe-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fe-flut{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
@keyframes fe-blink{0%,91%{transform:scaleY(1)}94%{transform:scaleY(.08)}97%,100%{transform:scaleY(1)}}
@keyframes fe-twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fe-hop{0%{transform:translateY(0)}30%{transform:translateY(-16px)}55%{transform:translateY(0)}72%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes fe-zz{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes egg-wob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-4deg)}82%{transform:rotate(4deg)}88%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}}
@keyframes h-mote{0%{transform:translateY(0);opacity:0}15%{opacity:.8}85%{opacity:.5}100%{transform:translateY(-120px);opacity:0}}
@media (max-width:420px){
  .nest .bubble{font-size:.9rem;padding:6px 10px}
  .nest .bubble .it{font-size:1.15rem}
  .homecards{grid-template-columns:1fr 1fr}
}

@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--lemon-soft)}50%{box-shadow:0 0 0 9px var(--lemon-soft)}}
@keyframes ring{0%{box-shadow:0 4px 0 var(--ink),0 0 0 0 var(--lemon)}100%{box-shadow:0 4px 0 var(--ink),0 0 0 16px transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes press{0%{transform:scale(1.7) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes drop{0%{transform:translateY(-14px) rotate(-22deg);opacity:0}100%{transform:translateY(0) rotate(-22deg);opacity:1}}
@keyframes drain{from{width:100%}to{width:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:460px){
  .chip.xp{display:none}
}
@media (max-width:420px){
  .brand{font-size:1.08rem}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat{padding:9px 10px}
  .stat .val{font-size:1.25rem}
}
</style>

   AUDIO: device Italian voices (speech synthesis) + small sound effects
   ============================================================ */
const Voice = { supported: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined', list: [], checked:false };
function voiceId(v){ return v.voiceURI || v.name; }
function loadVoices(){
  if (!Voice.supported) { Voice.checked = true; return; }
  let vs = []; try { vs = speechSynthesis.getVoices() || []; } catch(e){}
  const it = vs.filter(v => /^it([-_]|$)/i.test(v.lang || ''));
  const score = v => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0) + (/alice|federica|luca|elsa|isabella|diego|cosimo|paola|giuseppe|emma/i.test(v.name) ? 1 : 0);
  it.sort((a,b) => score(b) - score(a));
  const changed = it.map(voiceId).join('|') !== Voice.list.map(voiceId).join('|');
  Voice.list = it;
  if (changed){ if (SCREEN === 'settings') renderSettings(); else if (SCREEN === 'home') refreshVoiceBanner(); }
}
if (Voice.supported){
  loadVoices();
  try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch(e){ speechSynthesis.onvoiceschanged = loadVoices; }
  setTimeout(loadVoices, 600);
}
setTimeout(() => { loadVoices(); Voice.checked = true; if (SCREEN === 'home') refreshVoiceBanner(); }, 2200);
function enabledVoices(){ const on = Voice.list.filter(v => !S.off.includes(voiceId(v))); return on.length ? on : Voice.list; }
function voiceParams(vary){
  const pool = enabledVoices();
  let v = pool[0] || null, rate = S.rate, pitch = 1;
  if (vary && S.vary){ if (pool.length > 1) v = rnd(pool); rate *= 0.9 + Math.random()*0.18; pitch = 0.9 + Math.random()*0.2; }
  return {v, rate, pitch};
}
function sayP(text, p, slow){
  return new Promise(res => {
    if (!Voice.supported){ res(); return; }
    try {
      p = p || voiceParams(false);
      const busy = speechSynthesis.speaking || speechSynthesis.pending;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = (p.v && p.v.lang) || 'it-IT';
      if (p.v) u.voice = p.v;
      u.rate = Math.max(0.5, Math.min(1.4, p.rate * (slow ? 0.66 : 1)));
      u.pitch = p.pitch;
      let done = false; const fin = () => { if (!done){ done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1200 + text.length * 170);
      const go = () => { try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch(e){ fin(); } };
      busy ? setTimeout(go, 70) : go();
    } catch(e){ res(); }
  });
}
function player(text, p){
  const big = h('button', {class:'play', 'aria-label':'Play the word (R)'}, icon('play'));
  const slow = h('button', {class:'slow', 'aria-label':'Play slowly (S)'}, icon('slow'), 'Slow');
  const play = (sl) => { big.classList.add('playing'); sayP(text, p, sl).then(() => big.classList.remove('playing')); };
  big.addEventListener('click', () => play(false));
  slow.addEventListener('click', () => play(true));
  return {el: h('div', {class:'player'}, big, slow), play, big};
}
let actx = null;
function fx(kind){
  if (!S.fx) return;
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const tone = (f, at, dur, type='sine', vol=0.07) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t+at);
      g.gain.exponentialRampToValueAtTime(vol, t+at+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+at+dur);
      o.connect(g).connect(actx.destination); o.start(t+at); o.stop(t+at+dur+0.02);
    };
    if (kind === 'good'){ tone(660,0,.13); tone(990,.08,.2); }
    else if (kind === 'bad'){ tone(210,0,.2,'triangle',.06); }
    else if (kind === 'soft'){ tone(520,0,.12,'sine',.04); }
    else if (kind === 'line'){ [523,659,784].forEach((f,i)=>tone(f,i*.08,.2)); }
    else if (kind === 'win'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.26)); }
    else if (kind === 'coin'){ tone(1319,0,.09,'sine',.05); tone(1760,.07,.16,'sine',.05); }
    else if (kind.startsWith('tick')){ tone([1318,1568,1760][Number(kind[4]) || 0],0,.35,'sine',.045); }
    else if (kind === 'hatch'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,i*.14,2.6,'sine',.04)); tone(2093,.6,1.4,'triangle',.015); }
    else if (kind === 'patronus'){ [392,523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.12,1.6,'sine',.035)); tone(2637,.8,1.2,'triangle',.012); }
  } catch(e){}
}
function confetti(){
  if (reduceMotion()) return;
  const cv = $('#confetti'); const c = cv.getContext && cv.getContext('2d'); if (!c) return;
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.display = 'block';
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--lemon','--vowel','--blue','--good'].map(v => cs.getPropertyValue(v).trim() || '#F4C430');
  const parts = Array.from({length:140}, () => ({x:W/2 + (Math.random()-.5)*140, y:H*.32, vx:(Math.random()-.5)*10, vy:-Math.random()*10-3, r:Math.random()*6, vr:(Math.random()-.5)*.35, w:6+Math.random()*6, hh:8+Math.random()*8, col:rnd(cols)}));
  const t0 = performance.now();
  const step = t => {
    c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
    parts.forEach(p => { p.vy += .3; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle = p.col; c.fillRect(-p.w/2,-p.hh/2,p.w,p.hh); c.restore(); });
    if (t - t0 < 2400) requestAnimationFrame(step); else { c.clearRect(0,0,W,H); cv.style.display = 'none'; }
  };
  requestAnimationFrame(step);
}

function daysBetween(a, b){ const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number); return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 86400000); }

/* ---------- quests ---------- */
function ensureDaily(){
  const t = today(), q = P.quests;
  if (q.daily.date !== t){
    const hasPet = P.pets.length > 0, due = dueKeys().length;
    const pool = Object.keys(DAILY_POOL).filter(id => !(DAILY_POOL[id].pet && !hasPet) && !(DAILY_POOL[id].needDue && !due));
    const ids = [];
    ids.push(due ? 'review10' : rnd(pool.filter(id => !DAILY_POOL[id].listen && id !== 'review10')));
    ids.push(rnd(pool.filter(id => DAILY_POOL[id].listen)));
    ids.push(rnd(pool.filter(id => !ids.includes(id))));
    q.daily = {date:t, list: ids.map(id => ({id, n:0, done:false})), perfect:false};
  }
  const wk = weekKey();
  if (q.weekly.week !== wk) q.weekly = {week:wk, list: pick(Object.keys(WEEKLY_POOL), 2).map(id => ({id, n:0, done:false}))};
}
function track(kind, n=1){

  P.quests.daily.list.forEach(q => upd(q, DAILY_POOL[q.id]));
  P.quests.weekly.list.forEach(q => upd(q, WEEKLY_POOL[q.id]));
  const d = P.quests.daily;
  if (!d.perfect && d.list.length && d.list.every(q => q.done)){ d.perfect = true; earn(ECON.perfect, 0); P.luce = (P.luce || 0) + 1; addBond(5); toast(`Giornata perfetta! +${ECON.perfect} monete, +1 luce`, 'sparkle'); }
}

  const anim = (el, kf, dur, easing) => { const a = el.animate(kf, {duration:dur, easing:easing || 'ease-in-out', fill:'forwards'}); return a.finished.catch(() => {}); };
  const egg = svg.querySelector('.egg'), top = svg.querySelector('.shell-top'), bot = svg.querySelector('.shell-bottom');
  const cracks = [...svg.querySelectorAll('.crack')], cglow = [...svg.querySelectorAll('.crackglow')], shardEls = [...svg.querySelectorAll('.h-shard')];
  const glow = svg.querySelector('.h-glow'), ring = svg.querySelector('.h-ring'), flash = svg.querySelector('.h-flash');
  const ew = svg.querySelector('.elfwrap'), fe = ew.querySelector('.fe'), wings = ew.querySelector('.fe-wings'), eyes = [...ew.querySelectorAll('.fe-open')];
  const wobble = (deg, dur) => anim(egg, [{transform:'rotate(0)'},{transform:`rotate(${-deg}deg)`},{transform:`rotate(${deg}deg)`},{transform:`rotate(${-deg*0.6}deg)`},{transform:`rotate(${deg*0.6}deg)`},{transform:'rotate(0)'}], dur);
  const draw = (i, dur) => { fx('tick' + (i%3)); return anim(cracks[i], [{strokeDashoffset: cracks[i].style.strokeDashoffset},{strokeDashoffset: 0}], dur, 'ease-out'); };

    if (ended || gen !== GEN) return; ended = true; skip.hidden = true;
    if (skipped){ svg.querySelector('.cracks').style.display = 'none'; svg.querySelector('.shell-whole').style.display = 'none'; top.style.opacity = 0; bot.style.opacity = 0; ew.style.opacity = 1; ew.style.transform = 'translate(98px,116px) scale(.62)'; wings.style.transform = 'scale(1)'; fe.classList.remove('sleep'); glow.style.opacity = .5; }
    born.innerHTML = `${e.g === 'f' ? 'È nata!' : 'È nato!'}<small>${e.el} · ${e.emo} (${e.emoEn}). ${e.desc}</small>`;
    const input = h('input', {type:'text', id:'petname', value:e.name, maxlength:'16', 'aria-label':'Name'});

      const name = (input.value || e.name).trim().slice(0,16) || e.name;
      const pet = {id:k, name, born:today(), bond:0, hat:null, neck:null}; AWAKE.add(k);

  }

    await wobble(4, 1500); await wait(600);
    await draw(0, 650); await wait(300); await wobble(5, 1200); await draw(1, 550); await wait(250); await draw(2, 550); await wait(200);
    if (gen !== GEN || ended) return;
    anim(glow, [{opacity:0},{opacity:.95}], 1400); cglow.forEach(p => anim(p, [{opacity:0},{opacity:.9}], 1400));

    anim(flash, [{opacity:.9},{opacity:0}], 900, 'ease-out');

    anim(top, [{transform:'translate(0,0) rotate(0)', opacity:1},{transform:'translate(-18px,-110px) rotate(-30deg)', opacity:0}], 1500, 'cubic-bezier(.2,.7,.3,1)');
    shardEls.forEach((s,i) => { s.style.opacity = 1; const dx = (i-2)*26 + (i%2?10:-10), dy = 60 + i*12, r = (i%2?1:-1)*(40+i*15);
      anim(s, [{transform:'translate(0,0) rotate(0)', opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${r}deg)`, opacity:0}], 1100 + i*80, 'cubic-bezier(.3,0,.7,.4)'); });
    await anim(ew, [{opacity:0, transform:'translate(98px,150px) scale(.5)'},{opacity:1, transform:'translate(98px,116px) scale(.62)'}], 1700, 'cubic-bezier(.2,.8,.2,1)');

    anim(bot, [{opacity:1, transform:'translate(0,0)'},{opacity:0, transform:'translate(0,26px)'}], 1600);

}
function hatchBurst(svg, e){

    const a = (i/14)*Math.PI*2 + Math.random()*.4, d = 60 + Math.random()*50;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', sparkPath()); p.setAttribute('fill', i%2 ? e.decoCol[0] : '#fff'); p.setAttribute('transform', 'translate(160 176)');
    p.style.transformBox = 'fill-box'; p.style.transformOrigin = '50% 50%'; g.appendChild(p);
    p.animate([{transform:'translate(160px,176px) scale(.4)', opacity:1},{transform:`translate(${160+Math.cos(a)*d}px,${176+Math.sin(a)*d}px) scale(1.1)`, opacity:0}], {duration:1100+Math.random()*400, easing:'cubic-bezier(.1,.7,.3,1)', fill:'forwards'});
  }
}

function buildRoad(road, cur){
  const rows = LEVELS.map((L, i) => {
    const done = levelDone(L.id), isCur = cur && cur.id === L.id, locked = !done && !isCur;
    const st = (P.levels[L.id] || {}).stars || 0;
    const btn = h('button', {class:'stop ' + (done ? 'is-done' : isCur ? 'is-current' : 'is-locked'), onclick:() => openLevelSheet(L),
        'aria-label':`Stop ${L.id}, ${L.city}: ${L.en}. ${done ? st + ' stars' : isCur ? 'Next up' : 'Locked'}`},
      h('span', {class:'stamp', style:`--rot:${[-7,5,-3,8,-5,4][i%6]}deg`}, done ? icon('check') : String(L.id), locked ? h('span', {class:'tiny'}, icon('lock')) : null),
      h('span', {class:'stop-label'}, h('b', {}, L.city), h('small', {}, L.en), done ? starsEl(st) : null));
    return {row: h('div', {class:'stop-row'}, btn), btn, L, done};
  });
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'path'); svg.setAttribute('aria-hidden', 'true');
  road.replaceChildren(svg, ...rows.map(r => r.row));
  const layout = () => {
    const W = road.clientWidth; if (!W) return;
    const amp = Math.min(110, W * 0.24);
    const pts = [];
    rows.forEach((r, i) => {
      const x = Math.round(Math.sin(i * 1.15) * amp);
      const flip = x > 12;
      r.btn.classList.toggle('flip', flip);
      r.btn.style.left = r.btn.style.right = '';
      if (flip){ r.btn.style.right = (W/2 - x - 37) + 'px'; r.btn.style.maxWidth = (W/2 + x + 37) + 'px'; }
      else { r.btn.style.left = (W/2 + x - 37) + 'px'; r.btn.style.maxWidth = (W/2 - x + 37) + 'px'; }
      pts.push([W/2 + x, i * 104 + 12 + 37]);
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${rows.length * 104}`);
    let html = '';
    for (let i=0;i<pts.length-1;i++){
      const [x1,y1] = pts[i], [x2,y2] = pts[i+1], my = (y1+y2)/2;
      html += `<path class="seg${rows[i+1].done || (rows[i].done && cur && cur.id === rows[i+1].L.id) ? ' done' : ''}" d="M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}"/>`;
    }
    svg.innerHTML = html;
  };
  layout();
  requestAnimationFrame(layout);
  const onR = () => layout();
  window.addEventListener('resize', onR);
  CLEAN.push(() => window.removeEventListener('resize', onR));
}

/* ============================================================
   LESSON RUNNER
   ============================================================ */
const STEP_NAMES = {learn:'Impara', listen:'Ascolta', read:'Leggi', build:'Costruisci', game:'Gioca'};
function startLesson(L, opts={}){
  const only = opts.only || null;
  const steps = only ? [only] : ['learn','listen','read','build','game'];
  const sess = {L, steps, i:0, good:0, total:0, xp:0, only, t0:Date.now(), factor:lessonFactor(L), coins:0, egg:0};
  runStep(sess);
}
function lessonShell(sess){
  const n = sess.steps.length;
  const prog = h('div', {class:'progress', style:`--n:${n}`, 'aria-hidden':'true'}, sess.steps.map((s,i) => h('span', {class: i < sess.i ? 'on' : i === sess.i ? 'now' : ''})));
  const tip = h('span', {class:'leave-tip', hidden:true}, 'Tap again to leave');
  let armedT = 0;
  const close = h('button', {class:'iconbtn', 'aria-label':'Leave the lesson'}, icon('close'));
  close.addEventListener('click', () => {
    if (close.classList.contains('armed')){ clearTimeout(armedT); try { speechSynthesis.cancel(); } catch(e){} renderHome(); return; }
    close.classList.add('armed'); tip.hidden = false;
    armedT = setTimeout(() => { close.classList.remove('armed'); tip.hidden = true; }, 2500);
  });
  const body = h('div', {class:'lesson-body'});
  setView('lesson', h('div', {class:'lesson-top'}, close, tip, prog), body);
  const now = prog.querySelector('.now');
  return {body, kicker:'', setSub: f => { if (now) now.style.setProperty('--p', Math.max(4, Math.round(f*100)) + '%'); }};
}
function stepHead(kicker, title, sub){
  return h('div', {class:'step-head'}, h('div', {class:'eyebrow'}, kicker), h('h1', {class:'step-title'}, title), sub ? h('p', {class:'step-sub'}, sub) : null);
}
function runStep(sess){
  if (sess.i >= sess.steps.length) return finishLesson(sess);
  const k = sess.steps[sess.i], L = sess.L;
  const ctx = lessonShell(sess);
  const base = sess.steps.length > 1 ? `Step ${sess.i+1} of ${sess.steps.length} · ${L.city}` : `${L.city} · ${L.en}`;
  const next = (res={}) => { sess.good += res.good || 0; sess.total += res.total || 0; sess.i++; earn(ECON.step.c * sess.factor, ECON.step.e * sess.factor, sess); save(); runStep(sess); };
  ctx.kicker = base;
  if (k === 'learn') return stepLearn(ctx, L, next, !!sess.only);
  if (k === 'game') return GAMES[L.game.type](ctx, L, sess, next, base);
  const n = {listen:8, read:5, build:4}[k];
  runQueue(ctx, itemsFor(L, k, n), sess, next, (j, N) => `${base} · ${j} of ${N}`);
}
function runQueue(ctx, items, sess, done, kicker){
  const queue = items.filter(Boolean);
  const N = queue.length; let finished = 0, good = 0, total = 0;
  const next = () => {
    if (!queue.length) return done({good, total});
    const it = queue.shift(); const t0 = Date.now();
    ctx.kicker = kicker(Math.min(finished + 1, N), N, it);
    const R = it.kind === 'listen' ? renderListen : it.kind === 'build' ? renderBuild : renderRead;
    R(ctx, it, (ok, o={}) => {
      const graded = o.graded !== false;
      if (it.kind !== 'read') addEar(Date.now() - t0);
      if (!it.isRetry){ srs(it.key, ok); if (graded){ total++; if (ok) good++; } }
      if (!it.isRetry){ if (sess.review) track('review_item', 1); if (it.kind === 'read') track('read', 1); else if (ok) track(it.kind === 'listen' ? 'listen_ok' : 'build', 1); }
      gain(sess, ok ? (it.isRetry ? 3 : graded ? 10 : 5) : (graded ? 0 : 2));
      if (!ok && graded && !it.isRetry){ const again = makeItem(it.key) || it; again.isRetry = true; queue.push(again); }
      else finished++;
      ctx.setSub(finished / N);
      save(); renderTopbar();
      next();
    });
  };
  next();
}
function feedback(ok, ph, lines, cont, o={}){
  let fired = false; const go = () => { if (fired) return; fired = true; cont(); };
  const btn = h('button', {class:'btn ' + (ok ? 'btn-good' : 'btn-primary'), onclick:go}, 'Continue');
  const el = h('div', {class:'feedback ' + (ok ? 'good' : 'bad')},
    h('div', {class:'fb-head'}, icon(ok ? 'check' : 'cross'), h('span', {class:'it'}, ph.it), h('span', {class:'en'}, ph.en)),
    lines, h('div', {class:'fb-actions'}, btn));
  KEYS = Object.assign({}, KEYS || {}, {Enter:go});
  if (o.auto && !reduceMotion()){ el.classList.add('auto'); el.style.setProperty('--auto', o.auto + 'ms'); later(go, o.auto); }
  announce(ph.it + ' ' + ph.en);
  requestAnimationFrame(() => { try { btn.focus({preventScroll:true}); el.scrollIntoView({block:'nearest', behavior: reduceMotion() ? 'auto' : 'smooth'}); } catch(e){} });
  return el;
}

/* ---------- step: Costruisci ---------- */
const CONFUSE = [['schi','sci'],['sche','sce'],['sci','schi'],['sce','sche'],['sca','scia'],['chi','ci'],['che','ce'],['ghi','gi'],['ghe','ge'],
  ['cia','ca'],['cio','co'],['ciu','cu'],['gia','ga'],['gio','go'],['giu','gu'],['gli','li'],['gn','n'],['quo','cuo'],['cuo','quo'],['qua','cua'],['que','cue'],
  ['zz','ss'],['z','s'],['rr','r'],['à','a'],['è','e'],['é','e'],['ò','o'],['ù','u'],['ì','i'],['ce','che'],['ci','chi'],['ge','ghe'],['gi','ghi'],
  ['b','p'],['p','b'],['d','t'],['t','d'],['v','f'],['f','v'],['g','c'],['c','g'],['r','l'],['l','r'],['m','n'],['n','m'],['o','a'],['a','o'],['e','i'],['i','e'],['u','o']];
function makeTiles(w, L){
  const syl = w.syl.map(s => s.toLowerCase());
  const correct = new Set(syl), traps = new Set();
  syl.forEach((s,i) => {
    const nx = syl[i+1];
    if (nx && /[bcdfglmnprstvz]$/.test(s) && (nx[0] === s[s.length-1] || (s.endsWith('c') && nx[0] === 'q'))) traps.add(s.slice(0,-1));
    for (const [a,b] of CONFUSE){ if (s.includes(a)){ traps.add(s.replace(a,b)); break; } }
  });
  const trapList = shuffle([...traps].filter(t => t && !correct.has(t)));
  const others = shuffle([...new Set(L.build.flatMap(b => parseW(b).syl.map(x => x.toLowerCase())))].filter(x => !correct.has(x) && !traps.has(x)));
  const extra = Math.min(3, Math.max(2, 7 - syl.length));
  const chosen = trapList.slice(0, Math.min(2, extra));
  while (chosen.length < extra && others.length) chosen.push(others.shift());
  return shuffle([...syl.map(s => ({s})), ...chosen.map(s => ({s}))]);
}
function renderBuild(ctx, it, done){
  cleanup();
  const w = it.w, p = voiceParams(true), pl = player(w.say, p);
  const tiles = makeTiles(w, it.L);
  const slots = w.syl.map(() => null);
  let answered = false;
  const slotWrap = h('div', {class:'slots'});
  const slotEls = slots.map((_,i) => h('button', {class:'slot', 'aria-label':`Slot ${i+1}`, onclick:() => unplace(i)}));
  slotWrap.append(...slotEls);
  const tileEls = tiles.map(t => h('button', {class:'tile', onclick:() => place(t)}, wordEl(t.s, {dots:false})));
  const check = h('button', {class:'btn btn-primary', disabled:true, onclick:checkIt}, icon('check'), 'Check');
  const fb = h('div', {});
  function place(t){ if (answered || slots.includes(t)) return; const i = slots.indexOf(null); if (i < 0) return; slots[i] = t; draw(); }
  function unplace(i){ if (answered || !slots[i]) return; slots[i] = null; draw(); }
  function draw(){
    slotEls.forEach((el,i) => { el.replaceChildren(slots[i] ? wordEl(slots[i].s, {dots:false}) : ''); el.classList.toggle('filled', !!slots[i]); });
    tileEls.forEach((el,k) => el.classList.toggle('used', slots.includes(tiles[k])));
    check.disabled = slots.includes(null);
  }
  function checkIt(){
    if (answered || slots.includes(null)) return; answered = true;
    const built = slots.map(s => s.s).join('');
    const ok = built === w.text.toLowerCase();
    slotWrap.classList.add(ok ? 'good' : 'bad'); check.disabled = true; tileEls.forEach(t => t.disabled = true);
    fx(ok ? 'good' : 'bad');
    if (ok) fb.replaceChildren(feedback(true, phrase(PRAISE), [h('p', {class:'fb-line'}, wordEl(w), glossText(w) ? ` · ${glossText(w)}` : '')], () => done(true), {auto:1700}));
    else fb.replaceChildren(feedback(false, phrase(OOPS), [
      h('p', {class:'fb-line'}, 'The word is ', wordEl(w), '. You built ', h('b', {}, built), '.'),
      h('div', {class:'compare'}, compareBtn(w, p, true), compareBtn(glossOf(built) ? built : '~' + built, p, false))], () => done(false)));
  }
  ctx.body.replaceChildren(stepHead(ctx.kicker, 'Costruisci', 'Listen, then tap the syllables in order. Tap a slot to take a syllable back.'),
    pl.el, slotWrap, h('div', {class:'tiles'}, tileEls), h('div', {class:'actionrow'}, check), fb);
  later(() => pl.play(false), 380);
  KEYS = {r:() => pl.play(false), s:() => pl.play(true), Enter:checkIt, Backspace:() => { for (let i=slots.length-1;i>=0;i--) if (slots[i]){ unplace(i); break; } }};
}

const GAMES = { tombola:gameTombola, fish:gameFish, sort:gameSort, stress:gameStress };
function gameEnd(ctx, title, msg, good, total, done){
  if (total && good >= total) track('game_perfect', 1);
  const btn = h('button', {class:'btn btn-primary', onclick:() => done({good, total})}, 'Continue');
  return h('div', {class:'feedback good', style:'text-align:center'},
    h('div', {class:'tbanner'}, h('div', {class:'big'}, title)),
    h('p', {class:'fb-line'}, msg, ` ${good} of ${total} on the first try.`),
    h('div', {class:'fb-actions', style:'justify-content:center'}, btn));
}

function gameTombola(ctx, L, sess, done, base){
  cleanup();
  const words = [];
  for (const s of shuffle(L.listen.filter(Array.isArray))){ for (const w of shuffle(s)) if (!words.includes(w) && words.length < 9) words.push(w); if (words.length >= 9) break; }
  for (const r of shuffle(L.read)){ if (words.length >= 9) break; const t = parseW(r).text; if (!words.includes(t)) words.push(t); }
  const grid = shuffle(words), calls = shuffle(grid);
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let ci = 0, first = 0, missed = false, busy = false, t0 = Date.now(), cp = voiceParams(true);
  const marked = new Set(), lines = new Set();
  const big = h('button', {class:'play', 'aria-label':'Hear the call (R)'}, icon('play'));
  const play = sl => { big.classList.add('playing'); sayP(calls[ci], cp, sl).then(() => big.classList.remove('playing')); };
  big.addEventListener('click', () => play(false));
  const lbl = h('span', {class:'call-lbl'});
  const banner = h('div', {class:'tbanner', 'aria-live':'polite'});
  const endSlot = h('div', {});
  const cells = grid.map((w,i) => h('button', {class:'cell', onclick:() => tap(i)}, wordEl(w, {dots:false})));
  const upd = () => lbl.textContent = `Call ${Math.min(ci+1, 9)} of 9`;
  function tap(i){
    if (busy || ci >= calls.length || marked.has(i)) return;
    const w = grid[i];
    if (w === calls[ci]){
      marked.add(i); cells[i].classList.add('marked'); cells[i].disabled = true;
      addEar(Date.now() - t0); if (!missed){ first++; track('listen_ok', 1); } gain(sess, missed ? 3 : 10);
      let newLine = false;
      LINES.forEach((ln,k) => { if (!lines.has(k) && ln.every(x => marked.has(x))){ lines.add(k); newLine = true; ln.forEach(x => cells[x].classList.add('line')); } });
      ci++; missed = false;
      if (ci >= calls.length){ fx('win'); confetti(); banner.replaceChildren(); endSlot.replaceChildren(gameEnd(ctx, 'Tombola!', 'Full card!', first, 9, done)); save(); return; }
      if (newLine){ fx('line'); banner.replaceChildren(h('span', {class:'big'}, lines.size === 1 ? 'Terno!' : 'Un altro terno!'), h('div', {class:'muted'}, 'Three in a row.')); }
      else { fx('good'); banner.replaceChildren(h('span', {class:'muted'}, phrase(PRAISE).it)); }
      busy = true; upd();
      later(() => { busy = false; cp = voiceParams(true); t0 = Date.now(); play(false); }, 950);
    } else {
      missed = true; fx('bad');
      cells[i].classList.add('nope'); later(() => cells[i].classList.remove('nope'), 450);
      const g = glossText(parseW(w));
      banner.replaceChildren(h('span', {}, 'That one is ', h('b', {}, w), g ? ` (${g})` : '', '. Listen to the call again.'));
      const g0 = GEN; sayP(w, voiceParams(false)).then(() => { if (g0 === GEN) later(() => play(false), 300); });
    }
  }
  upd();
  ctx.body.replaceChildren(stepHead(base, 'Tombola', 'Listen to the caller and mark the word on your card. Three in a row is a terno. Fill the whole card to win.'),
    h('div', {class:'caller'}, big, h('button', {class:'slow', onclick:() => play(true)}, icon('slow'), 'Slow'), lbl),
    h('div', {class:'tcard'}, cells), banner, endSlot);
  later(() => play(false), 400);
  KEYS = {r:() => play(false), s:() => play(true)};
}

function gameFish(ctx, L, sess, done, base){
  cleanup();
  const pool = realListenWords(L), ROUNDS = 8;
  let order = shuffle(pool); while (order.length < ROUNDS) order = order.concat(shuffle(pool));
  let r = 0, good = 0, missed = false, busy = false, target = '', cp = null, fish = [], raf = 0, last = 0, t0 = 0;
  const still = reduceMotion();
  const sea = h('div', {class:'sea', role:'group', 'aria-label':'Fish carrying words'});
  const lbl = h('span', {class:'call-lbl'});
  const big = h('button', {class:'play', 'aria-label':'Hear the word (R)'}, icon('play'));
  const play = sl => { big.classList.add('playing'); sayP(target, cp, sl).then(() => big.classList.remove('playing')); };
  big.addEventListener('click', () => play(false));
  const msg = h('div', {class:'tbanner', 'aria-live':'polite'});
  const endSlot = h('div', {});
  function round(){
    target = order[r]; cp = voiceParams(true); missed = false; busy = false; t0 = Date.now();
    const words = [target, ...partnersOf(L, target)];
    for (const w of shuffle(pool)){ if (words.length >= 4) break; if (!words.includes(w)) words.push(w); }
    const W = sea.clientWidth || 340, H = sea.clientHeight || 300;
    sea.replaceChildren();
    fish = shuffle(words.slice(0,4)).map((w,i) => {
      const dir = i % 2 ? -1 : 1;
      const el = h('button', {class:'fish' + (dir < 0 ? ' left' : '')}, dir < 0 ? h('span', {class:'eye'}) : null, wordEl(w, {dots:false}), dir > 0 ? h('span', {class:'eye'}) : null);
      const f = {w, el, dir, x:0, y: 18 + i * ((H - 36) / 4), speed: 34 + Math.random()*38, caught:false, fw:0};
      el.addEventListener('click', () => tap(f));
      sea.append(el);
      return f;
    });
    fish.forEach((f,i) => { f.fw = f.el.offsetWidth; f.x = still ? (i % 2 ? W - f.fw - 22 : 22) : Math.random() * Math.max(10, W - f.fw); f.el.style.transform = `translate(${f.x}px,${f.y}px)`; });
    lbl.textContent = `Fish ${r+1} of ${ROUNDS}`;
    msg.replaceChildren(h('span', {class:'muted'}, 'Catch the fish that says the word you hear.'));
    later(() => play(false), 380);
  }
  function frame(t){
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0; last = t;
    const W = sea.clientWidth;
    for (const f of fish){
      if (f.caught) continue;
      if (!still){ f.x += f.dir * f.speed * dt; if (f.dir > 0 && f.x > W + 16) f.x = -f.fw - 16; if (f.dir < 0 && f.x < -f.fw - 16) f.x = W + 16; }
      f.el.style.transform = `translate(${f.x}px,${f.y}px)`;
    }
    raf = requestAnimationFrame(frame);
  }
  function tap(f){
    if (busy || f.caught) return;
    if (f.w === target){
      busy = true; f.caught = true; f.el.classList.add('caught'); f.el.style.transform = `translate(${f.x}px,${f.y - 90}px)`;
      addEar(Date.now() - t0); if (!missed){ good++; track('listen_ok', 1); } gain(sess, missed ? 3 : 10); fx('good');
      const g = glossText(parseW(target));
      msg.replaceChildren(h('span', {}, h('b', {}, phrase(PRAISE).it), ' ', target, g ? ` · ${g}` : ''));
      r++;
      if (r >= ROUNDS){ later(() => { cancelAnimationFrame(raf); fx('win'); confetti(); msg.replaceChildren(); endSlot.replaceChildren(gameEnd(ctx, 'Che pesca!', 'What a catch!', good, ROUNDS, done)); save(); }, 650); }
      else later(round, 900);
    } else {
      missed = true; fx('bad'); f.el.classList.add('nope'); later(() => f.el.classList.remove('nope'), 600);
      const g = glossText(parseW(f.w));
      msg.replaceChildren(h('span', {}, 'That fish says ', h('b', {}, f.w), g ? ` (${g})` : '', '. Listen again.'));
      const g0 = GEN; sayP(f.w, voiceParams(false)).then(() => { if (g0 === GEN) later(() => play(false), 300); });
    }
  }
  ctx.body.replaceChildren(stepHead(base, 'Pesca le parole', 'Word fishing: hear a word, then tap the fish that carries it.'),
    h('div', {class:'caller'}, big, h('button', {class:'slow', onclick:() => play(true)}, icon('slow'), 'Slow'), lbl),
    sea, msg, endSlot);
  CLEAN.push(() => cancelAnimationFrame(raf));
  requestAnimationFrame(() => { round(); raf = requestAnimationFrame(frame); });
  KEYS = {r:() => play(false), s:() => play(true)};
}

function gameSort(ctx, L, sess, done, base){
  const g = L.game, items = pick(g.items, 12); let i = 0, good = 0;
  const one = () => {
    cleanup();
    if (i >= items.length){
      ctx.body.replaceChildren(stepHead(base, 'Smista', g.q), gameEnd(ctx, good >= 10 ? 'Bravissimi tutti!' : 'Fatto!', 'Sorting done.', good, items.length, done));
      fx('win'); if (good >= 9) confetti(); return;
    }
    const [word, ans] = items[i], w = parseW(word), p = voiceParams(g.mode === 'hear'), t0 = Date.now();
    let answered = false;
    const fb = h('div', {});
    let pl = null;
    const card = g.mode === 'see' ? h('div', {class:'sortcard'}, wordEl(w, {plain:true, dots:false})) : (pl = player(w.say, p), h('div', {class:'sortcard'}, pl.el));
    const bks = g.buckets.map(([b,s],k) => h('button', {class:'bucket', onclick:() => choose(k)}, h('span', {class:'k', 'aria-hidden':'true'}, k === 0 ? '←' : '→'), h('b', {}, b), h('small', {}, s)));
    function choose(k){
      if (answered) return; answered = true;
      const ok = k === ans;
      bks.forEach((b,j) => { b.disabled = true; b.classList.add(j === ans ? 'good' : j === k ? 'bad' : 'dim'); });
      fx(ok ? 'good' : 'bad'); sayP(w.say, p);
      addEar(Date.now() - t0); if (ok){ good++; gain(sess, 10); if (g.mode === 'hear') track('listen_ok', 1); }
      const line = h('p', {class:'fb-line'}, wordEl(w, {focus:L.focus, dots:false}), ' → ', h('b', {}, g.buckets[ans][0]), ` (${g.buckets[ans][1]})`, glossText(w) ? ` · ${glossText(w)}` : '');
      fb.replaceChildren(feedback(ok, ok ? phrase(PRAISE) : phrase(OOPS), [line], () => { i++; one(); }, ok ? {auto:1500} : {}));
    }
    ctx.body.replaceChildren(stepHead(`${base} · ${i+1} of ${items.length}`, 'Smista', g.q), card, h('div', {class:'buckets'}, bks), fb);
    if (pl) later(() => pl.play(false), 380);
    KEYS = {ArrowLeft:() => choose(0), ArrowRight:() => choose(1), '1':() => choose(0), '2':() => choose(1), r:() => pl ? pl.play(false) : sayP(w.say, p)};
    ctx.setSub(i / items.length);
  };
  one();
}

function gameStress(ctx, L, sess, done, base){
  const items = pick(L.game.pool, 10); let i = 0, good = 0;
  const one = () => {
    cleanup();
    if (i >= items.length){
      ctx.body.replaceChildren(stepHead(base, 'Batti le mani', 'Clap on the stressed syllable.'), gameEnd(ctx, 'Che ritmo!', 'What rhythm!', good, items.length, done));
      fx('win'); if (good >= 8) confetti(); return;
    }
    const w = parseW(items[i]), p = voiceParams(true), pl = player(w.say, p), t0 = Date.now();
    let answered = false;
    const fb = h('div', {});
    const btns = w.syl.map((s,k) => h('button', {class:'sylbtn', onclick:() => choose(k)}, h('span', {class:'k', 'aria-hidden':'true'}, String(k+1)), wordEl(s, {dots:false})));
    function choose(k){
      if (answered) return; answered = true;
      const ok = k === w.stress;
      btns.forEach((b,j) => { b.disabled = true; b.classList.add(j === w.stress ? 'good' : j === k ? 'bad' : 'dim'); });
      fx(ok ? 'good' : 'bad'); addEar(Date.now() - t0); if (ok){ good++; gain(sess, 10); track('listen_ok', 1); }
      fb.replaceChildren(feedback(ok, ok ? phrase(PRAISE) : phrase(OOPS), [h('p', {class:'fb-line'}, wordEl(w), ' · stress on ', h('b', {}, w.syl[w.stress].toUpperCase()), glossText(w) ? ` · ${glossText(w)}` : ''),
        h('div', {class:'compare'}, compareBtn(w, p, true))], () => { i++; one(); }, ok ? {auto:1500} : {}));
    }
    ctx.body.replaceChildren(stepHead(`${base} · ${i+1} of ${items.length}`, 'Batti le mani', 'Clap game: listen, then tap the syllable that sounds strongest.'),
      pl.el, h('div', {class:'sylrow'}, btns), h('span', {class:'clap', 'aria-hidden':'true'}, 'clap… clap… CLAP!'), fb);
    later(() => pl.play(false), 380);
    KEYS = {r:() => pl.play(false), s:() => pl.play(true)};
    w.syl.forEach((_,k) => KEYS[String(k+1)] = () => choose(k));
    ctx.setSub(i / items.length);
  };
  one();
}

function finishLesson(sess){
  const L = sess.L;
  if (sess.only === 'learn'){ renderHome(); return; }
  const acc = sess.total ? sess.good / sess.total : 1;
  const stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1;
  const firstTime = !levelDone(L.id);
  const prev = P.levels[L.id] || {};
  const questsBefore = P.quests.daily.list.filter(q => q.done).length;
  if (!sess.only){ P.levels[L.id] = {done:true, stars:Math.max(prev.stars || 0, stars), plays:(prev.plays || 0) + 1}; P.lessons = (P.lessons || 0) + 1; gain(sess, 20); }
  else gain(sess, 5);
  bumpStreak();
  if (!sess.only){
    earn(ECON.lesson.c * sess.factor, ECON.lesson.e * sess.factor, sess);
    if (stars === 3){ earn(ECON.stars3.c * sess.factor, ECON.stars3.e * sess.factor, sess); track('stars3', 1); }
    if (firstTime){ earn(ECON.city, 0, sess); }
    track('lesson', 1); addBond(10);
  }
  let diplomaNow = false;
  if (!sess.only && !P.diploma && LEVELS.every(l => levelDone(l.id))){ P.diploma = today(); diplomaNow = true; }
  save(); renderTopbar();
  const questsNow = P.quests.daily.list.filter(q => q.done).length;
  sess.quests = questsNow > questsBefore ? `+${questsNow - questsBefore} done` : `${questsNow} of ${P.quests.daily.list.length}`;
  const nextL = LEVELS.find(l => l.id === L.id + 1);
  const head = !sess.only ? (stars === 3 ? ['Perfetto!', 'A perfect stamp.'] : stars === 2 ? ['Molto bene!', 'Very good. Replay any time for the third star.'] : ['Fatto!', 'Stamp earned. These sounds will come back in your reviews.']) : ['Bel gioco!', 'Nice game.'];
  const actions = [];
  if (!sess.only && nextL) actions.push(h('button', {class:'btn btn-primary btn-lg', onclick:() => startLesson(nextL)}, icon('play'), h('span', {class:'two'}, h('span', {}, `Next: ${nextL.city}`), h('small', {}, nextL.en))));
  actions.push(h('button', {class:'btn btn-lg', onclick:renderHome}, 'Back to the journey'));
  setView('result', h('section', {class:'result'},
    h('div', {class:'bigstamp'}, h('span', {class:'n'}, `Tappa ${L.id}`), h('span', {class:'city'}, L.city), h('span', {class:'n'}, today().split('-').reverse().join('.'))),
    !sess.only ? starsEl(stars, true) : null,
    h('h1', {}, head[0]), h('p', {class:'muted', style:'margin:4px 0 0'}, head[1]),
    firstTime && !sess.only && nextL && !levelDone(nextL.id) ? h('p', {style:'margin:8px 0 0'}, h('b', {}, nextL.city), ` is now unlocked (${nextL.en}).`) : null,
    diplomaNow ? h('p', {style:'margin:8px 0 0'}, h('b', {}, 'Diploma! '), 'You finished all twelve cities.') : null,
    !sess.only ? resultPet(stars) : null,
    h('div', {class:'statgrid'},
      h('div', {class:'stat'}, h('div', {class:'eyebrow'}, 'First try'), h('div', {class:'val'}, sess.total ? Math.round(acc*100) + '%' : '–')),
      h('div', {class:'stat'}, h('div', {class:'eyebrow'}, 'XP'), h('div', {class:'val'}, '+' + sess.xp)),
      h('div', {class:'stat'}, h('div', {class:'eyebrow'}, 'Ear training'), h('div', {class:'val'}, String(earMin()), h('small', {}, ' min')))),
    rewardRows(sess),
    eggReady() ? h('p', {style:'margin:0 0 14px'}, h('button', {class:'btn btn-primary', onclick:renderHatch}, icon('egg'), 'The egg is ready. Hatch it!')) : null,
    h('div', {class:'result-actions'}, actions)));

}

function startReview(){
  let keys = dueKeys(), practice = false;
  if (!keys.length){ practice = true; keys = Object.keys(ITEM_INDEX).filter(k => levelDone(ITEM_INDEX[k].L.id) && ITEM_INDEX[k].kind !== 'read'); }
  if (!keys.length) return;
  keys.sort((a,b) => ((P.items[a] || {}).b ?? 9) - ((P.items[b] || {}).b ?? 9) || ((P.items[a] || {}).d || '').localeCompare((P.items[b] || {}).d || ''));
  const take = practice ? pick(keys, 12) : shuffle(keys.slice(0, 15));
  const sess = {review:true, practice, steps:['review'], i:0, good:0, total:0, xp:0, coins:0, egg:0};
  const ctx = lessonShell(sess);
  runQueue(ctx, take.map(makeItem), sess, res => { sess.good = res.good; sess.total = res.total; finishReview(sess, practice); },
    (n, N, it) => `${practice ? 'Practice' : 'Ripasso'} · ${n} of ${N} · ${it.L.city}`);
}
